                dropdownMenu.classList.remove('right-0');
                dropdownMenu.classList.add('left-0');
            } else {
                htmlRoot.setAttribute('dir', 'ltr');
                htmlRoot.setAttribute('lang', lang);
                dropdownMenu.classList.remove('left-0');
                dropdownMenu.classList.add('right-0');
            }

            document.getElementById('currentFlag').innerText = flags[lang];

            document.getElementById('brandTitle').innerText = t.brandTitle;
            document.getElementById('brandSubtitle').innerText = t.brandSubtitle;
            document.getElementById('navRegisterBtn').innerText = t.navRegister;
