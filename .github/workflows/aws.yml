<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة تعليم السياقة المكي | Auto école Mekki</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        customBlue: '#1E68B8',
                        customYellow: '#F4CE52',
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            overflow-x: hidden;
        }
        @keyframes floatGentle {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(5deg); }
        }
        .gentle-float-1 { animation: floatGentle 5s ease-in-out infinite; }
        .gentle-float-2 { animation: floatGentle 7s ease-in-out infinite 1s; }
        .gentle-float-3 { animation: floatGentle 6s ease-in-out infinite 2s; }
        .gentle-float-4 { animation: floatGentle 8s ease-in-out infinite 1.5s; }
        
        .fade-text {
            transition: opacity 0.6s ease-in-out, transform 0.6s ease-in-out;
            opacity: 1;
            transform: translateY(0);
        }
        .fade-out {
            opacity: 0;
            transform: translateY(-8px);
        }
        input[type="text"], input[type="date"], input[type="tel"], select, textarea {
            box-sizing: border-box;
            width: 100%;
        }
        input[type="text"], input[type="date"], input[type="tel"], select {
            height: 44px;
        }
        .slider-img {
            pointer-events: none;
            user-select: none;
        }
    </style>
</head>
<body id="pageBody" class="bg-slate-50 min-h-screen flex flex-col justify-between relative leading-relaxed">

    <!-- Header / Navbar -->
    <header class="bg-[#1E68B8] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-3 py-2.5 flex justify-between items-center">
            <!-- شعار المؤسسة بأبعاد ثابتة ومريحة -->
            <div id="brandContainer" class="flex items-center gap-2 cursor-pointer shrink-0" onclick="scrollToTop()">
                <div class="w-9 h-9 md:w-10 md:h-10 rounded-full overflow-hidden border border-[#F4CE52] shadow bg-white flex items-center justify-center p-0.5 shrink-0">
                    <i class="fa-solid fa-car text-[#1E68B8] text-sm md:text-base"></i>
                </div>
                <div class="max-w-[140px] md:max-w-none">
                    <h1 id="brandTitle" class="text-xs md:text-sm font-black tracking-wide leading-tight truncate">مؤسسة المكي</h1>
                    <p id="brandSubtitle" class="text-[8px] md:text-[9px] text-[#F4CE52] font-bold leading-none truncate">تعليم السياقة والسلامة الطرقية</p>
                </div>
            </div>

            <!-- الأزرار والتحكمات الثابتة في الجهة الأخرى -->
            <div class="flex items-center gap-1.5 md:gap-2 shrink-0">
                <button onclick="toggleAccordion('register')" id="navRegisterBtn" class="bg-[#F4CE52] hover:bg-yellow-400 text-slate-900 font-black px-2.5 py-1.5 rounded-full shadow transition text-[11px] md:text-xs shrink-0 cursor-pointer">
                    سجل الآن
                </button>

                <!-- زر اختيار اللغة المصغر -->
                <div class="relative">
                    <button id="langMenuBtn" onclick="toggleLangMenu(event)" class="bg-blue-900/60 hover:bg-blue-900 px-2 py-1.5 rounded-lg border border-blue-400/30 transition flex items-center gap-1 text-xs shadow shrink-0 cursor-pointer">
                        <span id="currentFlag" class="text-sm">🇲🇦</span>
                        <i class="fa-solid fa-chevron-down text-[9px] text-[#F4CE52]"></i>
                    </button>

                    <div id="langDropdown" class="hidden absolute left-0 mt-2 w-28 bg-white rounded-xl shadow-2xl border border-slate-100 py-1.5 text-slate-800 z-50">
                        <button onclick="changeLanguage('ar'); toggleLangMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <span class="text-sm">🇲🇦</span> <span>العربية</span>
                        </button>
                        <button onclick="changeLanguage('fr'); toggleLangMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <span class="text-sm">🇫🇷</span> <span>Français</span>
                        </button>
                        <button onclick="changeLanguage('en'); toggleLangMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <span class="text-sm">🇬🇧</span> <span>English</span>
                        </button>
                    </div>
                </div>

                <!-- زر الهمبرغر بار المصغر -->
                <div class="relative">
                    <button id="menuBtn" onclick="toggleMenu(event)" class="text-white bg-blue-900/60 hover:bg-blue-900 p-1.5 rounded-lg border border-blue-400/30 transition focus:outline-none flex items-center justify-center w-8 h-8 shrink-0 cursor-pointer">
                        <i class="fa-solid fa-bars text-sm text-[#F4CE52]"></i>
                    </button>

                    <div id="dropdownMenu" class="hidden absolute mt-2 w-56 bg-white rounded-xl shadow-2xl border border-slate-100 py-1.5 text-slate-800 z-50">
                        <div id="menuIndexTitle" class="px-3 py-1.5 border-b border-slate-100 text-[11px] font-bold text-[#1E68B8]">فهرس الموقع</div>
                        <button onclick="scrollToTop(); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-house text-[10px] text-[#1E68B8] w-4 text-center"></i> <span data-i18n="menuHome">الرئيسية</span>
                        </button>
                        <button onclick="toggleAccordion('about'); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-circle-info text-[10px] text-[#1E68B8] w-4 text-center"></i> <span data-i18n="menuAbout">من نحن؟</span>
                        </button>
                        <button onclick="toggleAccordion('services'); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-book text-[10px] text-[#1E68B8] w-4 text-center"></i> <span data-i18n="menuServices">خدماتنا</span>
                        </button>
                        <button onclick="toggleAccordion('conditions'); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-id-card text-[10px] text-[#1E68B8] w-4 text-center"></i> <span data-i18n="menuConditions">شروط التسجيل</span>
                        </button>
                        <button onclick="toggleAccordion('offers'); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-gift text-[10px] text-[#1E68B8] w-4 text-center"></i> <span data-i18n="menuOffers">العروض المقترحة</span>
                        </button>
                        <button onclick="toggleAccordion('professors'); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-chalkboard-user text-[10px] text-[#1E68B8] w-4 text-center"></i> <span data-i18n="menuTrainers">المدربين</span>
                        </button>
                        <button onclick="toggleAccordion('gallery'); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-images text-[10px] text-[#1E68B8] w-4 text-center"></i> <span data-i18n="menuGallery">معرض الصور</span>
                        </button>
                        <button onclick="toggleAccordion('map-section'); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-location-dot text-[10px] text-[#1E68B8] w-4 text-center"></i> <span data-i18n="menuLocation">موقعنا وتقييماتنا</span>
                        </button>
                        <button onclick="toggleAccordion('register'); toggleMenu();" class="w-full text-start px-3 py-2 text-xs font-semibold hover:bg-blue-50 hover:text-[#1E68B8] transition border-t border-slate-100 text-amber-600 flex items-center gap-2 cursor-pointer">
                            <i class="fa-solid fa-user-plus text-[10px] w-4 text-center"></i> <span data-i18n="menuRegister">طلب التسجيل</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow py-6 px-4 max-w-7xl mx-auto w-full space-y-6">

        <!-- القسم الرئيسي (Hero) -->
        <div id="hero-block">
            <section class="bg-[#1E68B8] text-white pt-4 pb-10 px-6 rounded-[40px] relative overflow-hidden shadow-2xl space-y-6">
                <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-15 text-white">
                    <i class="fa-solid fa-car absolute top-8 right-12 text-3xl gentle-float-1"></i>
                    <i class="fa-solid fa-id-card absolute top-14 right-1/4 text-4xl gentle-float-2"></i>
                    <i class="fa-solid fa-road absolute top-8 left-16 text-4xl gentle-float-2"></i>
                    <i class="fa-solid fa-traffic-light absolute top-16 left-1/4 text-3xl gentle-float-3"></i>
                    <i class="fa-solid fa-steering-wheel absolute top-10 right-1/2 text-3xl gentle-float-4"></i>
                </div>

                <div class="max-w-4xl mx-auto text-center space-y-4 relative z-10">
                    <span id="heroBadge" class="inline-block bg-[#F4CE52] text-slate-900 font-black text-xs px-5 py-2 rounded-full shadow">
                        طريقك الآمن نحو نيل رخصة السياقة
                    </span>
                    
                    <div class="flex flex-col items-center justify-center space-y-2">
                        <h2 id="heroTitle" class="text-3xl md:text-5xl font-black text-white drop-shadow tracking-wide leading-tight">
                            مؤسسة المكي
                        </h2>
                        <h3 id="heroSubtitle" class="text-lg md:text-2xl font-bold text-[#F4CE52] tracking-wide leading-normal">
                            لتعليم السياقة والسلامة الطرقية
                        </h3>
                    </div>

                    <!-- صندوق الجمل المتغيرة -->
                    <div class="bg-white/10 backdrop-blur-md px-6 py-3 rounded-2xl border border-white/25 shadow-lg max-w-md mx-auto min-h-[55px] flex items-center justify-center">
                        <p id="dynamicTextView" class="fade-text text-xs md:text-sm font-semibold text-blue-50 leading-relaxed text-center">
                            القيادة ليست مجرد تحكم في السيارة، بل هي وعي ومسؤولية على الطريق
                        </p>
                    </div>
                </div>

                <!-- صندوق الصور -->
                <div class="max-w-[240px] md:max-w-[270px] mx-auto relative z-10 bg-white/10 backdrop-blur-md p-2.5 rounded-3xl border border-white/25 shadow-inner">
                    <div class="relative aspect-square rounded-2xl overflow-hidden bg-slate-900/40 flex items-center justify-center">
                        <div class="absolute inset-0 transition-opacity duration-700 ease-in-out slider-item opacity-100">
                            <img src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?auto=format&fit=crop&w=1000&q=80" alt="سياقة آمنة" class="w-full h-full object-cover slider-img">
                        </div>
                        <div class="absolute inset-0 transition-opacity duration-700 ease-in-out slider-item opacity-0">
                            <img src="https://images.unsplash.com/photo-1517524008697-84bbe3c3fd98?auto=format&fit=crop&w=1000&q=80" alt="قاعة الدرس" class="w-full h-full object-cover slider-img">
                        </div>
                        <div class="absolute inset-0 transition-opacity duration-700 ease-in-out slider-item opacity-0">
                            <img src="https://images.unsplash.com/photo-1508974239320-0a029497e820?auto=format&fit=crop&w=1000&q=80" alt="سيارات التدريب" class="w-full h-full object-cover slider-img">
                        </div>

                        <button onclick="prevSlide()" class="absolute left-2.5 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/85 text-white w-8 h-8 rounded-full flex items-center justify-center transition shadow cursor-pointer z-20" aria-label="السابق">
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                        </button>
                        <button onclick="nextSlide()" class="absolute right-2.5 top-1/2 -translate-y-1/2 bg-black/60 hover:bg-black/85 text-white w-8 h-8 rounded-full flex items-center justify-center transition shadow cursor-pointer z-20" aria-label="التالي">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>
                </div>
            </section>
        </div>

        <!-- الأقسام التفاعلية (أكورديون) -->
        <div class="space-y-4 pt-2">

            <!-- 1. من نحن؟ -->
            <div class="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden transition">
                <button type="button" onclick="toggleAccordion('about')" class="w-full p-6 font-black text-xl text-[#1E68B8] flex justify-between items-center hover:bg-blue-50/50 transition cursor-pointer">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-circle-info text-amber-500"></i>
                        <span data-i18n="secAbout">من نحن؟</span>
                    </div>
                    <i id="icon-about" class="fa-solid fa-chevron-down text-sm text-slate-400 transition transform"></i>
                </button>
                <div id="content-about" class="hidden p-6 pt-0 border-t border-slate-100 bg-slate-50/50">
                    <div class="max-w-3xl mx-auto pt-6 text-start">
                        <div id="aboutTextContent" class="bg-white rounded-3xl shadow-sm p-8 border border-slate-200 space-y-4 text-slate-700 text-sm md:text-base leading-loose"></div>
                    </div>
                </div>
            </div>

            <!-- 2. خدماتنا -->
            <div class="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden transition">
                <button type="button" onclick="toggleAccordion('services')" class="w-full p-6 font-black text-xl text-[#1E68B8] flex justify-between items-center hover:bg-blue-50/50 transition cursor-pointer">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-book text-amber-500"></i>
                        <span data-i18n="secServices">خدماتنا</span>
                    </div>
                    <i id="icon-services" class="fa-solid fa-chevron-down text-sm text-slate-400 transition transform"></i>
                </button>
                <div id="content-services" class="hidden p-6 pt-0 border-t border-slate-100 bg-slate-50/50">
                    <div class="max-w-3xl mx-auto pt-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-start">
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-start gap-4">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 text-[#1E68B8] flex items-center justify-center text-lg shrink-0 mt-1">
                                    <i class="fa-solid fa-chalkboard-user"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-slate-800 mb-1" data-i18n="serv1Title">تكوين تطبيقي</h4>
                                    <p class="text-xs text-slate-600 leading-relaxed" data-i18n="serv1Desc">مع مدربين خريجي OFPPT ذوي كفاءة عالية.</p>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-start gap-4">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 text-[#1E68B8] flex items-center justify-center text-lg shrink-0 mt-1">
                                    <i class="fa-solid fa-book-open"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-slate-800 mb-1" data-i18n="serv2Title">تكوين نظري</h4>
                                    <p class="text-xs text-slate-600 leading-relaxed" data-i18n="serv2Desc">في قانون السير مع مدربين ذوو خبرة ميدانية واسعة.</p>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-start gap-4">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 text-[#1E68B8] flex items-center justify-center text-lg shrink-0 mt-1">
                                    <i class="fa-solid fa-house-laptop"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-slate-800 mb-1" data-i18n="serv3Title">فضاء تكوين مجهز وعصري</h4>
                                    <p class="text-xs text-slate-600 leading-relaxed" data-i18n="serv3Desc">قاعات مجهزة بأحدث الوسائل التعليمية والتقنية.</p>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-start gap-4">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 text-[#1E68B8] flex items-center justify-center text-lg shrink-0 mt-1">
                                    <i class="fa-solid fa-car-side"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-slate-800 mb-1" data-i18n="serv4Title">سيارات تدريب حديثة</h4>
                                    <p class="text-xs text-slate-600 leading-relaxed" data-i18n="serv4Desc">مركبات جديدة كليا ومجهزة باحدث التجهيزات لراحة وسلامة المترشح.</p>
                                </div>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-start gap-4 md:col-span-2">
                                <div class="w-10 h-10 rounded-xl bg-blue-50 text-[#1E68B8] flex items-center justify-center text-lg shrink-0 mt-1">
                                    <i class="fa-solid fa-language"></i>
                                </div>
                                <div>
                                    <h4 class="font-black text-slate-800 mb-1" data-i18n="serv5Title">تكوين باللغات الثلاث</h4>
                                    <p class="text-xs text-slate-600 leading-relaxed" data-i18n="serv5Desc">عربية، فرنسية، إنجليزية (حسب طلب المترشح).</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. شروط التسجيل -->
            <div class="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden transition">
                <button type="button" onclick="toggleAccordion('conditions')" class="w-full p-6 font-black text-xl text-[#1E68B8] flex justify-between items-center hover:bg-blue-50/50 transition cursor-pointer">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-id-card text-amber-500"></i>
                        <span data-i18n="secConditions">شروط التسجيل</span>
                    </div>
                    <i id="icon-conditions" class="fa-solid fa-chevron-down text-sm text-slate-400 transition transform"></i>
                </button>
                <div id="content-conditions" class="hidden p-6 pt-0 border-t border-slate-100 bg-slate-50/50">
                    <div class="max-w-2xl mx-auto pt-6 space-y-4 text-start">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-sm shrink-0">1</div>
                            <p class="text-slate-700 font-bold text-sm md:text-base"><span data-i18n="cond1Text">ان يكون سن المترشح</span> <span class="text-[#1E68B8]" data-i18n="cond1Age">18 سنة شمسية او اكثر</span>.</p>
                        </div>
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                            <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center font-bold text-sm shrink-0">2</div>
                            <p class="text-slate-700 font-bold text-sm md:text-base"><span data-i18n="cond2Text">ان يكون قاطن</span> <span class="text-[#1E68B8]" data-i18n="cond2Area">باقليم بنسليمان بصفة عامة</span> <span data-i18n="cond2Note">(العنوان الموجود في البطاقة الوطنية)</span>.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4. العروض المقترحة -->
            <div class="bg-white rounded-3xl shadow-md border border-slate-200 overflow-hidden transition">
                <button type="button" onclick="toggleAccordion('offers')" class="w-full p-6 font-black text-xl text-[#1E68B8] flex justify-between items-center hover:bg-blue-50/50 transition cursor-pointer">
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-gift text-amber-500"></i>
                        <span data-i18n="secOffers">العروض المقترحة</span>
                    </div>
                    <i id="icon-offers" class="fa-solid fa-chevron-down text-sm text-slate-400 transition transform"></i>
                </button>
                <div id="content-offers" class="hidden p-6 pt-0 border-t border-slate-100 bg-slate-50/50">
                    <div class="max-w-3xl mx-auto pt-6 text-start">
                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm text-center space-y-2 hover:border-[#1E68B8] transition">
                                <div class="w-12 h-12 mx-auto rounded-full bg-blue-50 text-[#1E68B8] flex items-center justify-center text-xl">
                                    <i class="fa-solid fa-motorcycle"></i>
                                </div>
                                <h4 class="font-black text-slate-800 text-base" data-i18n="offerA">رخصة صنف A</h4>
                                <p class="text-xs text-slate-500" data-i18n="offerADesc">الدراجة النارية</p>
