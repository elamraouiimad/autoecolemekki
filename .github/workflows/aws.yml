                    <p>وفي سنة <strong class="text-[#1E68B8]">2013</strong>، تأسست <strong class="text-[#1E68B8]">مؤسسة تعليم السياقة المكي</strong>، لتصبح امتدادًا لمسيرة مهنية طويلة في مجال التكوين والتأهيل. ومنذ ذلك الحين، تساهم المؤسسة سنويًا في تكوين حوالي <strong class="text-[#1E68B8]">150 سائقًا</strong> في مختلف أصناف رخص السياقة، مع تحقيق <strong class="text-[#1E68B8]">نسب نجاح تتجاوز 90% سنويًا</strong>.</p>
                    <p>نؤمن في مؤسسة تعليم السياقة المكي بأن الحصول على رخصة السياقة لا يقتصر على اجتياز الامتحان، بل هو مرحلة أساسية لاكتساب المعرفة والمهارات التي تجعل من المتدرب <strong class="text-[#1E68B8]">سائقًا مسؤولًا، واثقًا ومحترمًا لقواعد السلامة الطرقية</strong>. لذلك نحرص على توفير الظروف الملائمة، والوسائل التقنية والتجهيزات الضرورية، إلى جانب التأطير والتكوين الجيد، من أجل تقديم تجربة تعليمية تواكب تطلعات المترشحين.</p>
                    <p>وبفضل سنوات الخبرة وجودة التكوين والاهتمام المستمر بالمترشحين، أصبحت المؤسسة تحظى <strong class="text-[#1E68B8]">سمعة متميزة وتقييمات عالية في مدينة بوزنيقة</strong>.</p>
                    <p>اليوم، نواصل مسيرتنا برؤية أكثر طموحًا، من خلال العمل على <strong class="text-[#1E68B8]">تطوير خدماتنا وفتح فروع جديدة</strong>، بهدف توسيع حضور المؤسسة وتقريب خدماتها من الشباب والمترشحين، مع الحفاظ على نفس قيم <strong class="text-[#1E68B8]">الجودة، الاحترافية والثقة</strong> التي رافقتنا منذ البداية.</p>
