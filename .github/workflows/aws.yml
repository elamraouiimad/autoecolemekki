            educationalQuotes = t.quotes;

            const htmlRoot = document.getElementById('htmlRoot');
            const dropdownMenu = document.getElementById('dropdownMenu');

            if (lang === 'ar') {
                htmlRoot.setAttribute('dir', 'rtl');
