            document.getElementById('address').setAttribute('placeholder', t.formAddressPlaceholder);
            document.getElementById('extraMessage').setAttribute('placeholder', t.formExtraMsgPlaceholder);

            document.querySelectorAll('[data-i18n]').forEach(el => {
