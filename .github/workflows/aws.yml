            });
        }

        function nextSlide() {
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            showSlide(currentSlideIndex);
            resetInterval();
        }

        function prevSlide() {
            currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
            showSlide(currentSlideIndex);
            resetInterval();
        }

        function autoNextSlide() {
            currentSlideIndex = (currentSlideIndex + 1) % slides.length;
            showSlide(currentSlideIndex);
        }

        function resetInterval() {
            clearInterval(slideInterval);
            slideInterval = setInterval(autoNextSlide, 5000);
        }

        function toggleMenu(event) {
            if (event) event.stopPropagation();
            const menu = document.getElementById('dropdownMenu');
            const langMenu = document.getElementById('langDropdown');
            if (langMenu) langMenu.classList.add('hidden');
            if (menu) {
                menu.classList.toggle('hidden');
            }
        }

        function toggleLangMenu(event) {
            if (event) event.stopPropagation();
            const langMenu = document.getElementById('langDropdown');
            const menu = document.getElementById('dropdownMenu');
            if (menu) menu.classList.add('hidden');
            if (langMenu) {
                langMenu.classList.toggle('hidden');
            }
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('dropdownMenu');
            const langMenu = document.getElementById('langDropdown');
            if (menu && !menu.contains(e.target)) {
                menu.classList.add('hidden');
            }
            if (langMenu && !langMenu.contains(e.target)) {
                langMenu.classList.add('hidden');
            }
        });

        function toggleAccordion(sectionId) {
            const content = document.getElementById('content-' + sectionId);
            const icon = document.getElementById('icon-' + sectionId);
            
            document.querySelectorAll('[id^="content-"]').forEach(item => {
                if (item.id !== 'content-' + sectionId) {
                    item.classList.add('hidden');
                }
            });
            document.querySelectorAll('[id^="icon-"]').forEach(item => {
                if (item.id !== 'icon-' + sectionId) {
                    item.classList.remove('rotate-180');
                }
            });

            if (content) {
                content.classList.toggle('hidden');
                if (icon) {
                    icon.classList.toggle('rotate-180');
                }
                if (!content.classList.contains('hidden')) {
                    content.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
            const menu = document.getElementById('dropdownMenu');
            const langMenu = document.getElementById('langDropdown');
            if (menu) menu.classList.add('hidden');
            if (langMenu) langMenu.classList.add('hidden');
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function sendToWhatsApp(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const birthDate = document.getElementById('birthDate').value;
            const address = document.getElementById('address').value;
            const phone = document.getElementById('phone').value;
            const studyLevel = document.getElementById('studyLevel').value;
            const extraMessage = document.getElementById('extraMessage').value;
            const consent = document.getElementById('consent').checked;

            if (!consent) {
                alert(currentLang === 'fr' ? "Veuillez accepter les conditions d'abord." : currentLang === 'en' ? "Please accept the terms first." : "المرجو الموافقة على شروط الاتصال أولاً.");
                return;
            }

            let textMessage = "";
            if (currentLang === 'fr') {
                textMessage = `Bonjour, je souhaite m'inscrire à l'Auto école Mekki:\n\n` +
                              `👤 *Nom complet:* ${fullName}\n` +
                              `📅 *Date de naissance:* ${birthDate}\n` +
                              `📍 *Adresse:* ${address}\n` +
                              `📞 *Téléphone:* ${phone}\n` +
                              `🚗 *Type de permis:* ${studyLevel}\n` +
                              (extraMessage ? `💬 *Message:* ${extraMessage}\n\n` : `\n`) +
                              `✅ J'accepte d'être contacté(e).`;
            } else if (currentLang === 'en') {
                textMessage = `Hello, I would like to register at Mekki Driving School:\n\n` +
                              `👤 *Full Name:* ${fullName}\n` +
                              `📅 *Date of Birth:* ${birthDate}\n` +
                              `📍 *Address:* ${address}\n` +
                              `📞 *Phone:* ${phone}\n` +
                              `🚗 *License Type:* ${studyLevel}\n` +
                              (extraMessage ? `💬 *Message:* ${extraMessage}\n\n` : `\n`) +
                              `✅ I agree to be contacted.`;
            } else {
                textMessage = `السلام عليكم، أرغب في التسجيل بمؤسسة المكي لتعليم السياقة:\n\n` +
                              `👤 *الاسم الكامل:* ${fullName}\n` +
                              `📅 *تاريخ الازدياد:* ${birthDate}\n` +
                              `📍 *العنوان:* ${address}\n` +
                              `📞 *رقم الهاتف:* ${phone}\n` +
                              `🚗 *نوع الرخصة / الطلب:* ${studyLevel}\n` +
                              (extraMessage ? `💬 *رسالة إضافية:* ${extraMessage}\n\n` : `\n`) +
                              `✅ أوافق على أن يتم الاتصال بي من طرف مؤسسة المكي.`;
            }

            const phoneNumber = "212618188683";
            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(textMessage)}`;

            window.location.href = whatsappUrl;
        }

        changeLanguage('ar');
    </script>

</body>
